<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .pt { fill: #000; }
    .region { fill: none; stroke: #000; stroke-width: 2; stroke-dasharray: 6 5; }
    .lbl { font-size: 15px; }
    .ref { font-size: 17px; font-weight: bold; }
    .title { font-size: 20px; font-weight: bold; }
    .axis { stroke: #000; stroke-width: 1.5; }
  </style>

  <rect class="box" x="90" y="150" width="520" height="520"/>
  <!-- axes -->
  <line class="axis" x1="110" y1="650" x2="590" y2="650"/>
  <line class="axis" x1="110" y1="650" x2="110" y2="170"/>
  <text class="lbl" x="350" y="680" text-anchor="middle">B&#246;lge ekeni 1</text>
  <text class="lbl" x="90" y="410" text-anchor="middle" transform="rotate(-90 90 410)">B&#246;lge ekeni 2</text>

  <!-- central region: edatlar (prepositions) -->
  <ellipse class="region" cx="350" cy="400" rx="90" ry="80"/>
  <circle class="pt" cx="330" cy="380" r="6"/><text class="lbl" x="330" y="365" text-anchor="middle">i&#231;in</text>
  <circle class="pt" cx="380" cy="410" r="6"/><text class="lbl" x="395" y="425">ile</text>
  <circle class="pt" cx="340" cy="430" r="6"/><text class="lbl" x="325" y="445">ve</text>
  <text class="lbl" x="350" y="300" text-anchor="middle">edatlar (merkez)</text>

  <!-- east-south region: isaretler (markers/particles) -->
  <ellipse class="region" cx="500" cy="560" rx="80" ry="60"/>
  <circle class="pt" cx="480" cy="550" r="6"/><text class="lbl" x="470" y="535">m&#305;&#351;</text>
  <circle class="pt" cx="520" cy="575" r="6"/><text class="lbl" x="530" y="590">-m&#305;&#351;</text>
  <text class="lbl" x="500" y="640" text-anchor="middle">i&#351;aretler (do&#231;u-g&#252;ney)</text>

  <!-- west region: isimler (nouns) -->
  <ellipse class="region" cx="200" cy="540" rx="70" ry="60"/>
  <circle class="pt" cx="185" cy="530" r="6"/><text class="lbl" x="150" y="520">kedi</text>
  <circle class="pt" cx="220" cy="555" r="6"/><text class="lbl" x="230" y="570">bah&#231;e</text>
  <text class="lbl" x="200" y="620" text-anchor="middle">isimler</text>

  <!-- north region: fiiller (verbs) -->
  <ellipse class="region" cx="430" cy="250" rx="80" ry="55"/>
  <circle class="pt" cx="410" cy="240" r="6"/><text class="lbl" x="380" y="230">uyudu</text>
  <circle class="pt" cx="455" cy="260" r="6"/><text class="lbl" x="465" y="275">g&#246;rd&#252;</text>
  <text class="lbl" x="430" y="200" text-anchor="middle">fiiller</text>

  <text class="ref" x="100" y="140">500</text>

  <!-- Title -->
  <text class="title" x="400" y="900" text-anchor="middle">&#350;ekil 5: Kelime b&#246;lge co&#231;rafyas&#237; (s&#237;k kelimelerin ortalama konumlar&#237;)</text>
</svg>
