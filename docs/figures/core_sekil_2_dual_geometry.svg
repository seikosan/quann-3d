<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .lbl { font-size: 15px; }
    .sub { font-size: 12px; }
    .ref { font-size: 17px; font-weight: bold; }
    .title { font-size: 20px; font-weight: bold; }
    .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .pt { fill: #000; }
    .edge { stroke: #000; stroke-width: 1.5; }
  </style>

  <!-- Sol: nokta bulutu (110 ciktisi) -->
  <rect class="box" x="30" y="40" width="300" height="240"/>
  <text class="ref" x="45" y="64">110</text>
  <text class="lbl" x="180" y="64" text-anchor="middle">Nokta Bulutu  {p&#8321;, p&#8322;, p&#8323;, p&#8324;} &#8712; &#8477;^D</text>
  <circle class="pt" cx="90"  cy="120" r="6"/>
  <circle class="pt" cx="180" cy="100" r="6"/>
  <circle class="pt" cx="250" cy="160" r="6"/>
  <circle class="pt" cx="140" cy="210" r="6"/>
  <line class="edge" x1="90"  y1="120" x2="180" y2="100"/>
  <line class="edge" x1="180" y1="100" x2="250" y2="160"/>
  <line class="edge" x1="250" y1="160" x2="140" y2="210"/>
  <line class="edge" x1="140" y1="210" x2="90"  y2="120"/>
  <text class="sub" x="180" y="262" text-anchor="middle">mesafe / a&#231;&#237; / norm</text>

  <!-- Orta: cift vektoru + MLP'ler -->
  <line class="arrow" x1="330" y1="160" x2="380" y2="160"/>
  <rect class="box" x="380" y="80" width="230" height="160"/>
  <text class="ref" x="395" y="104">120</text>
  <text class="lbl" x="495" y="104" text-anchor="middle">Çift-Geometri Girdisi</text>
  <text class="sub" x="495" y="130" text-anchor="middle">x_ij = [ p&#8321;&#8722;p&#8340; ,</text>
  <text class="sub" x="495" y="148" text-anchor="middle">&#8214;p&#8321;&#8722;p&#8340;&#8214; , cos&#952;,</text>
  <text class="sub" x="495" y="166" text-anchor="middle">&#8214;p&#8321;&#8214; , &#8214;p&#8340;&#8214; ] &#8712; &#8477;^(D+4)</text>
  <text class="sub" x="495" y="196" text-anchor="middle">fark: e&#351;de&#231;ken (kovaryant)</text>
  <text class="sub" x="495" y="214" text-anchor="middle">mesfe/cos/norm: d&#246;ndirme-de&#231;mez</text>

  <line class="arrow" x1="495" y1="240" x2="495" y2="285"/>

  <!-- Nokta MLP 121 + Cift MLP 122 -->
  <rect class="box" x="360" y="285" width="130" height="70"/>
  <text class="ref" x="372" y="308">121</text>
  <text class="lbl" x="425" y="320" text-anchor="middle">Nokta MLP</text>
  <text class="sub" x="425" y="340" text-anchor="middle">pay&#305;&#351;l&#237;</text>

  <rect class="box" x="500" y="285" width="130" height="70"/>
  <text class="ref" x="512" y="308">122</text>
  <text class="lbl" x="565" y="320" text-anchor="middle">Çift MLP</text>
  <text class="sub" x="565" y="340" text-anchor="middle">pay&#305;&#351;l&#237;</text>

  <line class="arrow" x1="425" y1="355" x2="455" y2="410"/>
  <line class="arrow" x1="565" y1="355" x2="535" y2="410"/>

  <!-- 123 Simetrik Bilesirme -->
  <rect class="box" x="390" y="410" width="230" height="80"/>
  <text class="ref" x="405" y="434">123</text>
  <text class="lbl" x="505" y="434" text-anchor="middle">Simetrik Birle&#351;tirme</text>
  <text class="sub" x="505" y="456" text-anchor="middle">MaxPool(f&#8321;)  +  MeanPool(g_ij)</text>
  <text class="sub" x="505" y="474" text-anchor="middle">&#8594; cloud_state  &#8712;  &#8477;^d_cloud</text>

  <line class="arrow" x1="505" y1="490" x2="505" y2="530"/>
  <rect class="box" x="380" y="530" width="250" height="50"/>
  <text class="lbl" x="505" y="560" text-anchor="middle">Perm&#252;tasyon-de&#231;mez k&#252;me durumu</text>

  <!-- Title -->
  <text class="title" x="410" y="608" text-anchor="middle">&#350;ekil 2: Nokta / &#231;ift-geometri ve simetrik birle&#351;tirme</text>
</svg>
