<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
    .axis { stroke: #000; stroke-width: 1.5; fill: none; }
    .pt { fill: #000; }
    .line { stroke: #000; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .lbl { font-size: 15px; }
    .ref { font-size: 17px; font-weight: bold; }
    .title { font-size: 20px; font-weight: bold; }
  </style>

  <!-- 3D box (isometric-ish) -->
  <!-- back edges -->
  <g class="axis">
    <!-- vertical back-left -->
    <line x1="250" y1="250" x2="250" y2="650"/>
    <!-- top face -->
    <line x1="250" y1="250" x2="550" y2="250"/>
    <line x1="550" y1="250" x2="650" y2="330"/>
    <line x1="250" y1="250" x2="150" y2="330"/>
    <line x1="150" y1="330" x2="450" y2="330"/>
    <!-- vertical edges -->
    <line x1="550" y1="250" x2="550" y2="650"/>
    <line x1="650" y1="330" x2="650" y2="730"/>
    <line x1="150" y1="330" x2="150" y2="730"/>
    <line x1="450" y1="330" x2="450" y2="730"/>
    <!-- bottom face -->
    <line x1="250" y1="650" x2="550" y2="650"/>
    <line x1="550" y1="650" x2="650" y2="730"/>
    <line x1="150" y1="730" x2="450" y2="730"/>
    <line x1="450" y1="730" x2="650" y2="730"/>
    <line x1="250" y1="650" x2="150" y2="730"/>
  </g>

  <!-- axes labels -->
  <text class="lbl" x="120" y="740">x</text>
  <text class="lbl" x="660" y="745">y</text>
  <text class="lbl" x="235" y="240">z</text>

  <!-- token points (kedi, bahce, bahce-de, uyudu) -->
  <!-- 200: token noktari -->
  <circle class="pt" cx="330" cy="560" r="7"/>
  <circle class="pt" cx="470" cy="500" r="7"/>
  <circle class="pt" cx="560" cy="600" r="7"/>
  <circle class="pt" cx="380" cy="420" r="7"/>

  <!-- distance lines 210 -->
  <g class="line">
    <line x1="330" y1="560" x2="470" y2="500"/>
    <line x1="470" y1="500" x2="560" y2="600"/>
    <line x1="560" y1="600" x2="380" y2="420"/>
    <line x1="380" y1="420" x2="330" y2="560"/>
    <line x1="330" y1="560" x2="560" y2="600"/>
    <line x1="470" y1="500" x2="380" y2="420"/>
  </g>

  <!-- point labels -->
  <text class="lbl" x="300" y="595">kedi</text>
  <text class="lbl" x="475" y="490">bah&#231;e</text>
  <text class="lbl" x="565" y="625">-de</text>
  <text class="lbl" x="385" y="410">uyudu</text>

  <!-- reference numerals -->
  <text class="ref" x="250" y="560">200</text>
  <text class="ref" x="400" y="470">210</text>

  <!-- Title -->
  <text class="title" x="400" y="900" text-anchor="middle">&#350;ekil 2: "kedi bah&#231;ede uyudu" 3D nokta bulutu</text>
  <text class="lbl" x="400" y="930" text-anchor="middle">200: token noktalar&#237;, 210: &#231;ift mesafe &#231;izgileri</text>
</svg>
