  <rect class="box" x="690" y="290" width="250" height="85" rx="8"/>
  <text class="label" x="815" y="326" text-anchor="middle">logit(full)</text><text class="small" x="815" y="355" text-anchor="middle">tüm noktalar</text>
  <text class="label" x="240" y="445" text-anchor="middle">p_k çıkarılmış bulut</text>
  <circle class="box" cx="145" cy="515" r="34"/><text class="small" x="145" y="523" text-anchor="middle">p_1</text>
  <circle class="dash" cx="240" cy="515" r="34"/><path d="M220 495 L260 535 M260 495 L220 535" stroke="#000" stroke-width="3"/>
  <circle class="box" cx="330" cy="515" r="34"/><text class="small" x="330" y="523" text-anchor="middle">p_3</text>
  <path class="line" d="M240 550 V600 H270"/>
  <rect class="box" x="275" y="570" width="330" height="100" rx="8"/>
  <text class="ref" x="300" y="610">260</text><text class="label" x="455" y="640" text-anchor="middle">Aynı okuyucuyla yeniden skorla</text>
  <path class="line" d="M605 620 H690 V505"/>
  <rect class="box" x="690" y="465" width="250" height="85" rx="8"/>
  <text class="label" x="815" y="500" text-anchor="middle">logit(−p_k)</text><text class="small" x="815" y="530" text-anchor="middle">nokta çıkarıldı</text>
  <rect class="box" x="650" y="600" width="330" height="80" rx="8"/>
  <text class="label" x="815" y="635" text-anchor="middle">Δ logit = logit(full) − logit(−p_k)</text>
