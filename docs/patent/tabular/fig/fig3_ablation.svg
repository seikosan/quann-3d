<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#000"/></marker></defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
    .box { fill: #fff; stroke: #000; stroke-width: 3; }
    .line { fill: none; stroke: #000; stroke-width: 3; marker-end: url(#arrow); }
    .dash { fill: #fff; stroke: #000; stroke-width: 3; stroke-dasharray: 10 7; }
    .title { font-size: 30px; font-weight: bold; }
    .ref { font-size: 24px; font-weight: bold; }
    .label { font-size: 22px; }
    .small { font-size: 19px; }
  </style>
  <text class="title" x="500" y="48" text-anchor="middle">Şekil 3 — Nokta çıkarma ablationı</text>
  <text class="label" x="240" y="110" text-anchor="middle">Tam kayıt bulutu</text>
  <circle class="box" cx="145" cy="190" r="34"/><text class="small" x="145" y="198" text-anchor="middle">p_1</text>
  <circle class="box" cx="240" cy="155" r="34"/><text class="small" x="240" y="163" text-anchor="middle">p_k</text>
  <circle class="box" cx="330" cy="200" r="34"/><text class="small" x="330" y="208" text-anchor="middle">p_3</text>
  <path class="line" d="M240 240 V300 H270"/>
  <rect class="box" x="275" y="270" width="330" height="100" rx="8"/>
