<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1000" width="820" height="1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .exp { fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 3; }
    .lbl { font-size: 15px; }
    .sub { font-size: 12px; }
    .ref { font-size: 17px; font-weight: bold; }
    .title { font-size: 20px; font-weight: bold; }
    .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .darrow { stroke: #000; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow); }
  </style>

  <!-- Girdi -->
  <rect class="box" x="260" y="20" width="300" height="50"/>
  <text class="lbl" x="410" y="50" text-anchor="middle">Girdi (token / kimlik-bucket / pencere)</text>
  <line class="arrow" x1="410" y1="70" x2="410" y2="105"/>

  <!-- 100 Girdi/Baglam Modulu -->
  <rect class="box" x="260" y="105" width="300" height="70"/>
  <text class="ref" x="272" y="128">100</text>
  <text class="lbl" x="410" y="145" text-anchor="middle">Girdi / Ba&#231;lam Mod&#252;l&#252;</text>
  <text class="sub" x="410" y="163" text-anchor="middle">birimler: token, (&#246;z., de&#231;-bucket), pencere</text>
  <line class="arrow" x1="410" y1="175" x2="410" y2="210"/>

  <!-- 110 Nokta Projeksiyonu -->
  <rect class="box" x="260" y="210" width="300" height="70"/>
  <text class="ref" x="272" y="233">110</text>
  <text class="lbl" x="410" y="250" text-anchor="middle">Nokta Projeksiyonu</text>
  <text class="sub" x="410" y="268" text-anchor="middle">p&#8321;, &#8230;, p&#8348; &#8712; &#8477;^D,  3 &#8804; D &#8804; 64</text>
  <line class="arrow" x1="410" y1="280" x2="410" y2="315"/>

  <!-- 120 Cift-Geometri Kodlayici (big) -->
  <rect class="box" x="150" y="315" width="520" height="200"/>
  <text class="ref" x="165" y="338">120</text>
  <text class="lbl" x="410" y="338" text-anchor="middle">Çift-Geometri Kodlay&#237;c&#237;</text>

  <!-- Nokta MLP -->
  <rect class="box" x="180" y="355" width="220" height="60"/>
  <text class="lbl" x="290" y="380" text-anchor="middle">Nokta MLP (pay&#305;&#351;l&#237;)</text>
  <text class="sub" x="290" y="398" text-anchor="middle">f&#8321; &#8712; &#8477;^d_cloud</text>

  <!-- Cift MLP -->
  <rect class="box" x="430" y="355" width="220" height="60"/>
  <text class="lbl" x="540" y="378" text-anchor="middle">Çift MLP</text>
  <text class="sub" x="540" y="396" text-anchor="middle">[p&#8321;&#8722;p&#8340;, &#8214;p&#8321;&#8722;p&#8340;&#8214;, cos&#952;, &#8214;p&#8321;&#8214;, &#8214;p&#8340;&#8214;] &#8712; &#8477;^(D+4)</text>

  <line class="arrow" x1="290" y1="415" x2="350" y2="458"/>
  <line class="arrow" x1="540" y1="415" x2="470" y2="458"/>

  <!-- 123 Simetrik Bilesirme -->
  <rect class="box" x="300" y="458" width="220" height="52"/>
  <text class="ref" x="312" y="480">123</text>
  <text class="lbl" x="410" y="482" text-anchor="middle">Simetrik Birle&#351;tirme</text>
  <text class="sub" x="410" y="500" text-anchor="middle">max-pool + mean-pool  &#8594;  cloud_state</text>
  <line class="arrow" x1="410" y1="510" x2="410" y2="545"/>

  <!-- 130 Skor Okuyucu -->
  <rect class="box" x="250" y="545" width="320" height="70"/>
  <text class="ref" x="262" y="568">130</text>
  <text class="lbl" x="410" y="583" text-anchor="middle">Skor Okuyucu</text>
  <text class="sub" x="410" y="601" text-anchor="middle">g&#246;rev skoru / risk / bir-sonraki-token</text>

  <!-- skor ciktisi -->
  <line class="arrow" x1="410" y1="615" x2="410" y2="650"/>
  <rect class="box" x="290" y="650" width="240" height="48"/>
  <text class="lbl" x="410" y="680" text-anchor="middle">G&#246;rev &#231;&#237;k&#237;s&#237; (skor/&#231;&#237;k&#237;)</text>

  <!-- AYNI BULUT notu (okuyucu girdisi = aciklama nesnesi) -->
  <rect class="exp" x="590" y="300" width="200" height="360" rx="8"/>
  <text class="lbl" x="690" y="328" text-anchor="middle">AYNI NOKTA-BULUTU</text>
  <text class="sub" x="690" y="346" text-anchor="middle">hem hesaplama hem</text>
  <text class="sub" x="690" y="361" text-anchor="middle">native aciklama nesnesi</text>

  <!-- 150 Yorumlama -->
  <rect class="box" x="600" y="375" width="180" height="62"/>
  <text class="ref" x="612" y="397">150</text>
  <text class="lbl" x="690" y="412" text-anchor="middle">Yorumlama</text>
  <text class="sub" x="690" y="429" text-anchor="middle">b&#246;lge / prototip</text>
  <line class="darrow" x1="600" y1="406" x2="672" y2="406"/>

  <!-- 260 Ablation -->
  <rect class="box" x="600" y="448" width="180" height="62"/>
  <text class="ref" x="612" y="470">260</text>
  <text class="lbl" x="690" y="485" text-anchor="middle">Ablation</text>
  <text class="sub" x="690" y="502" text-anchor="middle">leave-one-point-out</text>
  <line class="darrow" x1="600" y1="479" x2="672" y2="479"/>

  <!-- 270 Decoder -->
  <rect class="box" x="600" y="521" width="180" height="62"/>
  <text class="ref" x="612" y="543">270</text>
  <text class="lbl" x="690" y="558" text-anchor="middle">Decoder</text>
  <text class="sub" x="690" y="575" text-anchor="middle">metne / etikete</text>
  <line class="darrow" x1="600" y1="552" x2="672" y2="552"/>

  <!-- 280 Karsı-faktürel -->
  <rect class="box" x="600" y="594" width="180" height="62"/>
  <text class="ref" x="612" y="616">280</text>
  <text class="lbl" x="690" y="631" text-anchor="middle">Kar&#305;-Fakt&#252;rel</text>
  <text class="sub" x="690" y="648" text-anchor="middle">tek / &#231;ift maske denetimi</text>
  <line class="darrow" x1="600" y1="625" x2="672" y2="625"/>

  <!-- Native aciklama ciktisi -->
  <line class="arrow" x1="410" y1="698" x2="410" y2="730"/>
  <rect class="box" x="270" y="730" width="280" height="60"/>
  <text class="lbl" x="410" y="755" text-anchor="middle">Native Aciklama</text>
  <text class="sub" x="410" y="773" text-anchor="middle">(ablation-metin, prototip, drift)</text>

  <!-- 290 Paketleyici -->
  <line class="arrow" x1="410" y1="790" x2="410" y2="820"/>
  <rect class="box" x="250" y="820" width="320" height="70"/>
  <text class="ref" x="262" y="843">290</text>
  <text class="lbl" x="410" y="858" text-anchor="middle">Paketleyici (da&#231;&#237;t&#237;m)</text>
  <text class="sub" x="410" y="876" text-anchor="middle">okuyucu + kantiz&#246;r + decoder + manifest</text>

  <line class="arrow" x1="410" y1="890" x2="410" y2="920"/>
  <rect class="box" x="270" y="920" width="280" height="48"/>
  <text class="lbl" x="410" y="950" text-anchor="middle">Self-contained Edge Paketi</text>

  <!-- Title -->
  <text class="title" x="410" y="992" text-anchor="middle">&#350;ekil 1: Evrensel birle&#351;ik mimari (100&#8211;290)</text>
</svg>
