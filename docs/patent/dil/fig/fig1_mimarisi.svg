  <text class="ref" x="212" y="712">130</text>
  <text class="lbl" x="400" y="725" text-anchor="middle">Tahmin Mod&#252;l&#252;</text>
  <text class="sub" x="330" y="752" text-anchor="middle">word_logits &#8712; &#8477;<tspan baseline-shift="super" font-size="10">vocab</tspan></text>
  <text class="sub" x="510" y="752" text-anchor="middle">p_next &#8712; &#8477;<tspan baseline-shift="super" font-size="10">D</tspan>  (131)</text>
  <line class="arrow" x1="400" y1="770" x2="400" y2="815"/>

  <!-- bir sonraki token -->
  <rect class="box" x="280" y="815" width="240" height="50"/>
  <text class="lbl" x="400" y="845" text-anchor="middle">Bir sonraki token</text>

  <!-- Yorumlama 150 (side) -->
  <rect class="box" x="660" y="490" width="130" height="100"/>
  <text class="ref" x="672" y="512">150</text>
  <text class="lbl" x="725" y="537" text-anchor="middle">Yorumlama</text>
  <text class="sub" x="725" y="557" text-anchor="middle">mod&#252;l&#252;</text>
  <text class="sub" x="725" y="577" text-anchor="middle">(mesafe, a&#231;&#237;, b&#246;lge)</text>
  <line class="arrow" x1="650" y1="540" x2="660" y2="540"/>

  <!-- Title -->
  <text class="title" x="400" y="940" text-anchor="middle">&#350;ekil 1: Sistem mimarisi</text>
</svg>
