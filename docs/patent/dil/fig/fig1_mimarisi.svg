<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .lbl { font-size: 15px; }
    .sub { font-size: 13px; }
    .ref { font-size: 17px; font-weight: bold; }
    .title { font-size: 20px; font-weight: bold; }
    .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Token dizisi -->
  <rect class="box" x="250" y="30" width="300" height="50"/>
  <text class="lbl" x="400" y="60" text-anchor="middle">Token dizisi [t&#8321;, &#8230;, t&#8348;]</text>
  <line class="arrow" x1="400" y1="80" x2="400" y2="120"/>

  <!-- Tokenizasyon 140 -->
  <rect class="box" x="250" y="120" width="300" height="70"/>
  <text class="ref" x="262" y="142">140</text>
  <text class="lbl" x="400" y="163" text-anchor="middle">Tokenizasyon Mod&#252;l&#252; (byte-level BPE)</text>
  <text class="sub" x="400" y="181" text-anchor="middle">subword token'lar</text>
  <line class="arrow" x1="400" y1="190" x2="400" y2="230"/>

  <!-- Baglam Kodlayici 100 -->
  <rect class="box" x="250" y="230" width="300" height="70"/>
  <text class="ref" x="262" y="252">100</text>
  <text class="lbl" x="400" y="273" text-anchor="middle">Ba&#231;lam Kodlay&#237;c&#237; (L katman transformer)</text>
  <text class="sub" x="400" y="291" text-anchor="middle">c&#8321;, &#8230;, c&#8348; &#8712; &#8477;<tspan baseline-shift="super" font-size="10">d_model</tspan></text>
  <line class="arrow" x1="400" y1="300" x2="400" y2="340"/>

  <!-- ND Projeksiyon 110 -->
  <rect class="box" x="250" y="340" width="300" height="70"/>
  <text class="ref" x="262" y="362">110</text>
  <text class="lbl" x="400" y="383" text-anchor="middle">ND Projeksiyon Mod&#252;l&#252; (Tanh)</text>
  <text class="sub" x="400" y="401" text-anchor="middle">p&#8321;, &#8230;, p&#8348; &#8712; [-1,1]<tspan baseline-shift="super" font-size="10">D</tspan></text>
  <line class="arrow" x1="400" y1="410" x2="400" y2="450"/>

  <!-- Bulut Kodlayici 120 (big) -->
  <rect class="box" x="150" y="450" width="500" height="210"/>
