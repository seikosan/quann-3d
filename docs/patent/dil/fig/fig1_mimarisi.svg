  <rect class="box" x="420" y="490" width="200" height="60"/>
  <text class="ref" x="432" y="512">122</text>
  <text class="lbl" x="525" y="530" text-anchor="middle">&#199;ift MLP</text>
  <text class="sub" x="525" y="545" text-anchor="middle">[p&#8321;&#8722;p&#8340;, &#8214;&#8322;&#8214;, cos&#952;, &#8214;p&#8321;&#8214;, &#8214;p&#8340;&#8214;]</text>

  <line class="arrow" x1="285" y1="550" x2="345" y2="595"/>
  <line class="arrow" x1="525" y1="550" x2="455" y2="595"/>

  <!-- Kume Bilesirme 123 -->
  <rect class="box" x="300" y="595" width="200" height="50"/>
  <text class="ref" x="312" y="617">123</text>
  <text class="lbl" x="400" y="632" text-anchor="middle">K&#252;me Birle&#351;tirme</text>
  <line class="arrow" x1="400" y1="645" x2="400" y2="690"/>

  <!-- Tahmin Modulu 130 -->
