  <!-- Nokta MLP 121 -->
  <rect class="box" x="180" y="490" width="200" height="60"/>
  <text class="ref" x="192" y="512">121</text>
  <text class="lbl" x="285" y="530" text-anchor="middle">Nokta MLP</text>
  <text class="sub" x="285" y="545" text-anchor="middle">pay&#305;&#351;l&#237; a&#231;&#237;rl&#237;k</text>

